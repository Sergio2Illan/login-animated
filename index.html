<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InitSeven</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>

</head>
<body>
    <div class="container" id="container">
        <div class="form-container sign-up">
            <form>
                <h1>Crear una cuenta</h1>
                <div class="social-icons">
                    <a href="#" class="icon">
                        <i class="fa-brands fa-google-plus-g" aria-hidden="true"></i>
                    </a>
                    <a href="#" class="icon">
                        <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
                    </a>
                    <a href="#" class="icon">
                        <i class="fa-brands fa-github" aria-hidden="true"></i>
                    </a>
                    <a href="#" class="icon">
                        <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
                    </a>
                </div>

                <span>o usa tu email para registrarte</span>
                <input type="text" placeholder="Nombre" id="ipName">
                <input type="email" placeholder="Email" id="ipEmail">
                <input type="password" placeholder="Contraseña" id="ipPassword">
                <button>Registrarse</button>
            </form>
        </div>

        <div class="form-container sign-in">
            <form>
                <h1>Inicia sesión</h1>
                <div class="social-icons">
                    <a href="#" class="icon">
                        <i class="fa-brands fa-google-plus-g"></i>
                    </a>
                    <a href="#" class="icon">
                        <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
                    </a>
                    <a href="#" class="icon">
                        <i class="fa-brands fa-github" aria-hidden="true"></i>
                    </a>
                    <a href="#" class="icon">
                        <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
                    </a>
                </div>

                <span>o usa tu email y tu contraseña</span>
                <input type="email" placeholder="Email" id="ipEmail">
                <input type="password" placeholder="Contraseña" id="ipPassword">
                <a href="#">¿Has olvidado tu contraseña?</a>
                <button>Inicia sesión</button>
            </form>
        </div>

        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Bienvenido</h1>
                    <p>Introduce tus datos personales para poder acceder a todos los recursos del site</p>
                    <button id="login" class="hidden">Inicia Sesión</button>
                </div>
            </div>
        </div>

        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-right">
                    <h1>¡Hola, Amigo!</h1>
                    <p>Registrate y accede a todos los recursos de la web</p>
                    <button id="register" class="hidden">Registrate</button>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
